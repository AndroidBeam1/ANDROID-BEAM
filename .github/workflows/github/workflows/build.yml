{
"name": "Build APK",
"on": {"push": {}, "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"run": "unzip -q -o nfc-beam.zip -d proj"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true"},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}},
{"run": "gradle -p proj assembleDebug --no-daemon --stacktrace"},
{"run": "cp proj/app/build/outputs/apk/debug/app-debug.apk nfc-beam.apk"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "nfc-beam-apk", "path": "nfc-beam.apk"}},
{"env": {"GH_TOKEN": "${{ github.token }}"}, "run": "gh release create build-${{ github.run_number }} nfc-beam.apk --title \"NFC Beam build ${{ github.run_number }}\" --notes \"Tap nfc-beam.apk to install.\" --target ${{ github.sha }}"}
]}}
}
