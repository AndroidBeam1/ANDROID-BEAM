name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -q -o nfc-beam.zip -d proj

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build the APK
        run: gradle -p proj assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk nfc-beam.apk

      - name: Keep a backup copy
        uses: actions/upload-artifact@v4
        with:
          name: nfc-beam-apk
          path: nfc-beam.apk

      - name: Publish as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" nfc-beam.apk \
            --title "NFC Beam build ${{ github.run_number }}" \
            --notes "Tap nfc-beam.apk below to download and install." \
            --target "${{ github.sha }}"
